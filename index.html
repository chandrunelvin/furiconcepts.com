<style>
  /* shown until the app has loaded; React replaces everything inside #root */
  html, body { margin: 0; background: #faf9f6; }
  .boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #faf9f6; }
  .boot img { width: 170px; height: auto; animation: boot-pulse 1.4s ease-in-out infinite; }
  @keyframes boot-pulse { 50% { opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .boot img { animation: none; } }
</style>
</head>
<body>
<div id="root"><div class="boot" aria-hidden="true"><img src="/images/furni-logo-boot.webp" alt=""></div></div>
